<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>ТЕМ - Професійний Навігатор</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- html2canvas для скріншотів -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #app-container { display: flex; height: 100vh; }
        
        .sidebar { 
            width: 380px; 
            background: #fff; 
            border-right: 2px solid #ddd; 
            display: flex; 
            flex-direction: column; 
            padding: 15px; 
            z-index: 1000; 
            overflow-y: auto; 
            box-sizing: border-box;
        }
        
        #map { flex: 1; height: 100%; background: #f0f0f0; }
        
        .btn-back-calc {
            background: #2c3e50;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 10px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .btn-back-calc:hover { background: #1a252f; }

        .header { background: #1a73e8; color: white; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 10px; }
        
        .search-container { position: relative; margin-bottom: 10px; }
        .search-box { display: flex; gap: 5px; }
        .search-input { 
            flex: 1; 
            padding: 9px; 
            border: 1px solid #1a73e8; 
            border-radius: 6px; 
            font-size: 12px; 
            outline: none; 
        }
        .btn-search { background: #1a73e8; color: white; border: none; border-radius: 6px; padding: 0 12px; cursor: pointer; font-weight: bold; }
        
        .search-results {
            position: absolute;
            top: 40px;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            max-height: 180px;
            overflow-y: auto;
            display: none;
            z-index: 2000;
        }
        .search-item { padding: 8px 10px; font-size: 11px; cursor: pointer; border-bottom: 1px solid #eee; }
        .search-item:hover { background: #e8f0fe; color: #1a73e8; }

        .btn-transfer { background: #27ae60; color: white; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 5px; width: 100%; }
        .btn-save { background: #3498db; color: white; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 10px; }
        
        .city-item { display: flex; justify-content: space-between; padding: 8px; margin-bottom: 5px; border-left: 6px solid #ccc; background: #f1f3f4; font-size: 12px; font-weight: bold; border-radius: 0 4px 4px 0; }
        
        .route-card { background: #f8f9fa; border: 1px solid #ddd; padding: 10px; border-radius: 8px; margin-bottom: 12px; cursor: pointer; position: relative; transition: 0.3s; }
        .route-card:hover { border-color: #1a73e8; background: #f1f7ff; }
        .route-card img { width: 100%; border-radius: 5px; margin-top: 8px; border: 1px solid #ccc; display: none; }
        .route-card.active img { display: block; }
        .btn-del-route { position: absolute; top: 5px; right: 5px; background: #e74c3c; color: white; border: none; border-radius: 4px; padding: 2px 8px; cursor: pointer; font-size: 10px; }
        
        #status { font-size: 11px; color: #d35400; text-align: center; margin: 5px 0; font-weight: bold; min-height: 15px; }
        .btn-clear { background: #e74c3c; color: white; padding: 10px; border: none; border-radius: 8px; cursor: pointer; margin-top: auto; }
    </style>
</head>
<body>

<div id="app-container">
    <div class="sidebar">
        <button class="btn-back-calc" onclick="returnToCalc()">
            🧮 До калькулятора
        </button>

        <div class="header">
            <small>Загальний пробіг:</small>
            <div id="total-val" style="font-size: 24px; font-weight: bold;">0.0 км</div>
        </div>

        <div class="search-container">
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 Введіть місто або координати..." onkeydown="if(event.key==='Enter') performSearch()">
                <button class="btn-search" onclick="performSearch()">Пошук</button>
            </div>
            <div id="searchResults" class="search-results"></div>
        </div>

        <button class="btn-transfer" onclick="transferData()">📥 ДОДАТИ ДО РОЗРАХУНКУ</button>
        <button class="btn-save" onclick="saveCurrentRoute()">📸 ЗБЕРЕГТИ МАРШРУТ</button>

        <div id="status">Клікніть на мапі або знайдіть точку</div>
        
        <div id="city-list"></div>

        <hr>
        <b style="font-size: 14px; color: #2c3e50;">🗂️ Історія (нові зверху):</b>
        <div id="saved-list" style="margin-top: 10px;"></div>
        
        <button class="btn-clear" onclick="location.reload()">🗑️ Очистити мапу</button>
    </div>
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let map, routeLayer, waypoints = [], currentCityData = {}, routeSegments = [];
    
    // Палітра яскравих кольорів ДЛЯ МІСТ (без сірого)
    const colors = ['#1a73e8', '#2ecc71', '#e74c3c', '#f39c12', '#9b59b6', '#1abc9c', '#e67e22'];
    
    // "Траса" жорстко зафіксована за сірим кольором (#7f8c8d)
    let cityColorMap = { "Траса": "#7f8c8d" };

    function cleanEmoji(text) {
        if (!text) return "";
        return text.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F700}-\u{1F77F}\u{1F800}-\u{1F8FF}\u{1F800}-\u{1F8FF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{1FA70}-\u{1FAFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '').trim();
    }

    window.onload = function() {
        map = L.map('map', { 
            center: [49.423, 26.987], 
            zoom: 11,
            preferCanvas: true 
        });
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            crossOrigin: true 
        }).addTo(map);

        routeLayer = L.featureGroup().addTo(map);
        loadSavedRoutes();

        map.on('click', (e) => {
            addWaypoint(e.latlng.lng, e.latlng.lat);
        });
    };

    function addWaypoint(lng, lat) {
        L.marker([lat, lng]).addTo(routeLayer);
        waypoints.push([lng, lat]);
        map.setView([lat, lng], map.getZoom());
        if (waypoints.length >= 2) calculateDetailedRoute();
    }

    function delay(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    // Отримання назви з розрізненням Місто / Траса
    async function getLocName(lat, lon, isExactPoint = false) {
        try {
            const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=16&addressdetails=1`);
            const d = await r.json();
            
            if (d && d.address) {
                const addr = d.address;
                // Вважаємо містом лише великі населені пункти (місто, смт, райцентр) або точки, обрані користувачем
                const cityName = addr.city || addr.town || addr.township;
                
                if (cityName) {
                    return cleanEmoji(cityName);
                }
                
                // Якщо це точка поставлена користувачем (старт/фініш), допускаємо смт/селище
                if (isExactPoint) {
                    const villageName = addr.village || addr.suburb || addr.hamlet;
                    if (villageName) return cleanEmoji(villageName);
                }
            }
            return "Траса";
        } catch(e) { 
            return "Траса"; 
        }
    }

    async function calculateDetailedRoute() {
        document.getElementById('status').innerText = "⏳ Прокладаємо маршрут...";
        const coords = waypoints.map(p => p.join(',')).join(';');
        
        try {
            const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`);
            const data = await res.json();
            
            if (!data.routes || data.routes.length === 0) {
                alert("Не вдалося прокласти маршрут!");
                return;
            }

            routeLayer.clearLayers();
            waypoints.forEach(p => L.marker([p[1], p[0]]).addTo(routeLayer));
            
            const path = data.routes[0].geometry.coordinates;
            currentCityData = {};
            routeSegments = [];
            
            // Скидаємо відповідність кольорів крім Траси
            cityColorMap = { "Траса": "#7f8c8d" };
            let colorIndex = 0;

            // Визначаємо стартову та кінцеву локації точно
            let startLoc = await getLocName(path[0][1], path[0][0], true);
            await delay(250);
            let endLoc = await getLocName(path[path.length - 1][1], path[path.length - 1][0], true);
            await delay(250);

            const totalPoints = path.length;
            const step = Math.max(1, Math.floor(totalPoints / 15));

            let lastLoc = startLoc;
            let currentSegmentDist = 0;

            for (let i = 0; i < path.length - 1; i++) {
                const p1 = [path[i][1], path[i][0]];
                const p2 = [path[i+1][1], path[i+1][0]];
                const dist = map.distance(p1, p2) / 1000;

                let locNow = lastLoc;
                
                // Перевіряємо чи ми в місті старту, місті фінішу, чи на трасі
                if (i === 0) {
                    locNow = startLoc;
                } else if (i >= path.length - 15) {
                    locNow = endLoc;
                } else if (i % step === 0) {
                    locNow = await getLocName(p1[0], p1[1], false);
                    await delay(150);
                }

                if (i > 0 && locNow !== lastLoc) {
                    if (currentSegmentDist >= 0.1) {
                        routeSegments.push({ loc: lastLoc, dist: currentSegmentDist });
                    }
                    currentSegmentDist = 0;
                    lastLoc = locNow;
                }

                currentSegmentDist += dist;
                currentCityData[lastLoc] = (currentCityData[lastLoc] || 0) + dist;

                // Призначення кольору
                if (!cityColorMap[lastLoc]) {
                    cityColorMap[lastLoc] = colors[colorIndex % colors.length];
                    colorIndex++;
                }

                L.polyline([p1, p2], {
                    color: cityColorMap[lastLoc], 
                    weight: 7, 
                    opacity: 0.9
                }).addTo(routeLayer);
            }

            if (currentSegmentDist >= 0.1) {
                routeSegments.push({ loc: lastLoc, dist: currentSegmentDist });
            }

            renderBreakdown((data.routes[0].distance / 1000).toFixed(1));
        } catch (err) {
            console.error(err);
            document.getElementById('status').innerText = "❌ Помилка побудови маршруту";
        }
    }

    function renderBreakdown(total) {
        document.getElementById('total-val').innerText = total + " км";
        const list = document.getElementById('city-list');
        list.innerHTML = "";

        for (let loc in currentCityData) {
            const km = currentCityData[loc].toFixed(1);
            if (km < 0.1) continue;
            list.innerHTML += `
                <div class="city-item" style="border-left-color: ${cityColorMap[loc] || '#7f8c8d'}">
                    <span>${loc}</span>
                    <span>${km} км</span>
                </div>`;
        }
        document.getElementById('status').innerText = "✅ Розраховано по ділянках";
    }

    async function performSearch() {
        const query = document.getElementById('searchInput').value.trim();
        const resultsContainer = document.getElementById('searchResults');
        resultsContainer.style.display = 'none';

        if (!query) return;

        const coordRegex = /^[-+]?([1-8]?\d(\.\d+)?|90(\.0+)?)[,\s]+[-+]?(180(\.0+)?|((1[0-7]\d)|([1-9]?\d))(\.\d+)?)$/;
        if (coordRegex.test(query)) {
            const coords = query.split(/[,\s]+/).map(Number);
            addWaypoint(coords[1], coords[0]);
            document.getElementById('searchInput').value = '';
            return;
        }

        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=ua&limit=5`);
            const data = await res.json();

            if (data.length === 0) {
                alert("Нічого не знайдено!");
                return;
            }

            if (data.length === 1) {
                addWaypoint(parseFloat(data[0].lon), parseFloat(data[0].lat));
                document.getElementById('searchInput').value = '';
            } else {
                resultsContainer.innerHTML = '';
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'search-item';
                    div.innerText = cleanEmoji(item.display_name);
                    div.onclick = () => {
                        addWaypoint(parseFloat(item.lon), parseFloat(item.lat));
                        resultsContainer.style.display = 'none';
                        document.getElementById('searchInput').value = '';
                    };
                    resultsContainer.appendChild(div);
                });
                resultsContainer.style.display = 'block';
            }
        } catch (e) {
            console.error(e);
            alert("Помилка з'єднання при пошуку.");
        }
    }

    async function saveCurrentRoute() {
        if (Object.keys(currentCityData).length === 0) return alert("Побудуйте маршрут!");
        let name = prompt("Введіть назву маршруту (напр. Хмельницький-Деражня):");
        if (!name) return;
        name = cleanEmoji(name);

        document.getElementById('status').innerText = "📸 Робимо скріншот...";
        
        const mapEl = document.getElementById('map');
        const canvas = await html2canvas(mapEl, { useCORS: true });
        const imgData = canvas.toDataURL("image/png");

        const saved = JSON.parse(localStorage.getItem('tem_routes_final')) || [];
        
        saved.unshift({
            name: name,
            total: document.getElementById('total-val').innerText,
            cities: currentCityData,
            segments: routeSegments,
            image: imgData,
            date: new Date().toLocaleString()
        });

        localStorage.setItem('tem_routes_final', JSON.stringify(saved));
        loadSavedRoutes();
        document.getElementById('status').innerText = "✅ Збережено у верх списку";
    }

    function loadSavedRoutes() {
        const container = document.getElementById('saved-list');
        const saved = JSON.parse(localStorage.getItem('tem_routes_final')) || [];
        container.innerHTML = saved.map((r, i) => `
            <div class="route-card" onclick="this.classList.toggle('active'); selectRoute(${i})">
                <button class="btn-del-route" onclick="event.stopPropagation(); deleteRoute(${i})">Видалити</button>
                <b>${cleanEmoji(r.name)}</b><br>
                <small>${r.total} (${r.date})</small>
                <img src="${r.image}" alt="карта">
            </div>
        `).join('');
    }

    function deleteRoute(i) {
        if (!confirm("Видалити цей маршрут?")) return;
        let saved = JSON.parse(localStorage.getItem('tem_routes_final'));
        saved.splice(i, 1);
        localStorage.setItem('tem_routes_final', JSON.stringify(saved));
        loadSavedRoutes();
    }

    function selectRoute(i) {
        const saved = JSON.parse(localStorage.getItem('tem_routes_final'));
        currentCityData = saved[i].cities;
        routeSegments = saved[i].segments || [];
        document.getElementById('status').innerText = "📍 Обрано: " + cleanEmoji(saved[i].name);
    }

    function transferData() {
        if (routeSegments.length === 0 && Object.keys(currentCityData).length === 0) {
            return alert("Побудуйте або оберіть маршрут зі списку!");
        }

        const formattedRows = [];

        if (routeSegments.length > 0) {
            for (let i = 0; i < routeSegments.length; i++) {
                const seg = routeSegments[i];
                const fromLoc = cleanEmoji(seg.loc);
                let toLoc = (i < routeSegments.length - 1) ? cleanEmoji(routeSegments[i + 1].loc) : fromLoc;

                const routeName = (fromLoc === toLoc) ? `${fromLoc} - ${fromLoc}` : `${fromLoc} - ${toLoc}`;
                formattedRows.push({
                    name: routeName,
                    km: parseFloat(seg.dist).toFixed(1),
                    isHighway: (fromLoc === "Траса" || toLoc === "Траса")
                });
            }
        } else {
            const locKeys = Object.keys(currentCityData);
            for (let i = 0; i < locKeys.length; i++) {
                const loc = cleanEmoji(locKeys[i]);
                const nextLoc = (i < locKeys.length - 1) ? cleanEmoji(locKeys[i + 1]) : loc;
                const km = parseFloat(currentCityData[locKeys[i]]).toFixed(1);
                if (km < 0.1) continue;

                const routeName = (loc === nextLoc) ? `${loc} - ${loc}` : `${loc} - ${nextLoc}`;
                formattedRows.push({
                    name: routeName,
                    km: km,
                    isHighway: (loc === "Траса")
                });
            }
        }

        localStorage.setItem('map_to_calc_detailed', JSON.stringify(formattedRows));

        try {
            const channel = new BroadcastChannel('tem_route_channel');
            channel.postMessage({ action: 'load_route', data: formattedRows });
        } catch(e) {
            console.log("BroadcastChannel не підтримується", e);
        }

        if (window.opener && !window.opener.closed) {
            try {
                if (typeof window.opener.loadRouteFromMap === 'function') {
                    window.opener.loadRouteFromMap(formattedRows);
                } else {
                    window.opener.location.reload();
                }
            } catch (e) {
                console.log("Помилка доступу до window.opener", e);
            }
            window.close();
        } else {
            setTimeout(() => {
                window.close();
                window.location.href = 'calc_2.html';
            }, 100);
        }
    }

    function returnToCalc() {
        if (window.opener && !window.opener.closed) {
            window.close();
        } else {
            window.location.href = 'calc_2.html';
        }
    }

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.search-container')) {
            document.getElementById('searchResults').style.display = 'none';
        }
    });
</script>
</body>
</html>
