<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід у систему ТЕМ</title>
    <style>
        body { font-family: sans-serif; background: #1b3022; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: rgba(0,0,0,0.6); padding: 30px; border-radius: 10px; width: 320px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { margin-bottom: 20px; color: #2ecc71; }
        input { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border-radius: 5px; border: 1px solid #444; background: #222; color: #fff; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; font-size: 16px; }
        button:hover { background: #219150; }
        .guest-btn { background: #2980b9; margin-top: 8px; }
        .guest-btn:hover { background: #1f6694; }
    </style>
</head>
<body>

<div class="card">
    <h2>Вхід у систему ТЕМ</h2>
    <input type="text" id="username" placeholder="Логін">
    <input type="password" id="password" placeholder="Пароль">
    
    <button onclick="login()">УВІЙТИ</button>
    <button onclick="loginAsGuest()" class="guest-btn">УВІЙТИ ЯК ГІСТЬ</button>
</div>

<script>
    function login() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();

        if (!u || !p) {
            alert("Будь ласка, введіть логін та пароль!");
            return;
        }

        // Перевірка на акаунт Програміста / Адміна
        if ((u === 'admin' || u === 'programmer') && p === '123') {
            const user = { username: u, role: 'programmer' };
            localStorage.setItem('currentUser', JSON.stringify(user));
            alert("Успішний вхід! Роль: Програміст");
            window.location.href = 'admin.html';
        } 
        // Звичайний користувач -> Перехід на Головну панель
        else {
            const user = { username: u, role: 'guest' };
            localStorage.setItem('currentUser', JSON.stringify(user));
            alert("Успішний вхід! Роль: Користувач (" + u + ")");
            window.location.href = 'index.html'; // <--- Перехід на Головну панель
        }
    }

    function loginAsGuest() {
        const user = { username: 'Гість', role: 'guest' };
        localStorage.setItem('currentUser', JSON.stringify(user));
        window.location.href = 'index.html'; // <--- Перехід на Головну панель
    }
</script>

</body>
</html>
