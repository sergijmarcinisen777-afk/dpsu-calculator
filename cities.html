<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>ТЕМ - Керування містами</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1b3022; color: #fff; padding: 30px; display: flex; justify-content: center; }
        .container { width: 600px; background: rgba(255,255,255,0.1); padding: 25px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #2ecc71; border-bottom: 2px solid #2ecc71; padding-bottom: 10px; margin-top: 0; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { padding: 12px; border-radius: 6px; border: none; font-weight: bold; }
        input[type="text"] { flex-grow: 1; }
        input[type="number"] { width: 80px; }
        .btn-add { background: #27ae60; color: white; border: none; padding: 0 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .city-list { background: white; color: #333; border-radius: 8px; overflow: hidden; }
        .city-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid #eee; }
        .city-item:last-child { border-bottom: none; }
        .city-name { font-weight: bold; font-size: 16px; }
        .city-val { color: #27ae60; font-weight: bold; background: #e8f4fd; padding: 4px 8px; border-radius: 4px; }
        .btn-del { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .back-link { display: inline-block; margin-top: 20px; color: #bdc3c7; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏙️ База міст за Наказом</h2>
    <p style="font-size: 13px; color: #bdc3c7;">Додайте міста та відсоток надбавки. Ці дані будуть автоматично застосовані в калькуляторі.</p>
    
    <div class="input-group">
        <input type="text" id="cityName" placeholder="Назва населеного пункту">
        <input type="number" id="cityVal" placeholder="%">
        <button class="btn-add" onclick="addCity()">ДОДАТИ</button>
    </div>

    <div class="city-list" id="cityList">
        </div>

    <a href="calc.html" class="back-link">← Повернутися до калькулятора</a>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('city_db_permanent')) || {};

    function render() {
        const list = document.getElementById('cityList');
        list.innerHTML = "";
        const keys = Object.keys(db).sort();
        
        if (keys.length === 0) {
            list.innerHTML = "<div style='padding:20px; text-align:center; color:#999;'>База порожня</div>";
            return;
        }

        keys.forEach(city => {
            list.innerHTML += `
                <div class="city-item">
                    <div>
                        <span class="city-name">${city}</span>
                        <span class="city-val">${db[city]}%</span>
                    </div>
                    <button class="btn-del" onclick="deleteCity('${city}')">Видалити</button>
                </div>`;
        });
    }

    function addCity() {
        const name = document.getElementById('cityName').value.trim();
        const val = document.getElementById('cityVal').value;
        if (!name || !val) return alert("Заповніть назву та відсоток!");
        
        db[name] = parseFloat(val);
        localStorage.setItem('city_db_permanent', JSON.stringify(db));
        document.getElementById('cityName').value = "";
        document.getElementById('cityVal').value = "";
        render();
    }

    function deleteCity(name) {
        if(confirm(`Видалити ${name} з бази?`)) {
            delete db[name];
            localStorage.setItem('city_db_permanent', JSON.stringify(db));
            render();
        }
    }

    render();
</script>
</body>
</html>
